name: Apply learning UX polish

on:
  push:
    branches:
      - feat/learning-ux-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run learning UX polish patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/learning-ux-polish
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply scoped patch
        run: |
          python3 scripts/apply-learning-ux-polish-v2.py
          python3 scripts/update-learning-ux-tests.py

      - name: Install dependencies
        run: npm ci

      - name: Check project context
        run: npm run check:context

      - name: Audit project data
        run: npm run audit:project

      - name: Audit vocabulary targets
        run: npm run audit:vocabulary

      - name: Validate curriculum
        run: npm run validate:curriculum

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit --incremental false

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-learning-ux-polish.py scripts/apply-learning-ux-polish-v2.py scripts/update-learning-ux-tests.py .github/workflows/apply-learning-ux-polish.yml .github/workflows/sentence-audit.yml
          git add -A
          git commit -m "Polish lesson input flow and word details"
          git push origin HEAD:feat/learning-ux-polish
