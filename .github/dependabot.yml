version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Keep declarations aligned with the oldest supported Node.js major.
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    commit-message:
      prefix: "chore(actions)"
